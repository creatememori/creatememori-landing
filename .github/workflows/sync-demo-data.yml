name: Sync demo data

on:
  schedule:
    # Every three hours, a few minutes past the hour (UTC).
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-demo-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync from the resource site
        run: node scripts/sync-demo-data.mjs

      - name: Commit if the snapshot changed
        run: |
          if git diff --quiet -- demo-data.js; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo-data.js
          git commit -m "chore: auto-sync demo data"
          git push
